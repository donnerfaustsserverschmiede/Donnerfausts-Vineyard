<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bestellung · Donnerfaust Saloon</title><style>
body{margin:0;background:#f5f0e5;color:#17202a;font:16px Arial,sans-serif}.box{max-width:620px;margin:32px auto;padding:30px;background:#fffdf8;border:1px solid #ddd5c5;border-radius:20px;box-sizing:border-box}.brand{display:flex;gap:14px;align-items:center;border-bottom:1px solid #e5dfd4;padding-bottom:18px;margin-bottom:28px}.brand img{width:64px;height:64px;border-radius:14px;object-fit:cover}.brand small,.ey{display:block;color:#b09242;font-weight:800;letter-spacing:.18em;font-size:10px}.brand b,h1{font-family:Georgia,serif}.brand b{font-size:20px}h1{font-size:34px;margin:8px 0 26px}label{display:block;font-size:12px;font-weight:800;color:#6d665c;margin:0 0 7px}input,select{width:100%;box-sizing:border-box;padding:14px;border:1px solid #d7cfc1;border-radius:10px;background:#fff;font:inherit;margin-bottom:20px}input[readonly]{background:#f7f1e4;font-weight:700}.submit{width:100%;padding:15px;border:0;border-radius:10px;background:#c5a14a;color:#17202a;font-weight:800;font-size:16px;margin-top:4px}.muted{font-size:12px;color:#888;text-align:center;line-height:1.5}.result{text-align:center;padding:10px 0 4px}.result .total{display:flex;justify-content:space-between;border-top:1px solid #ddd5c5;padding-top:16px;margin-top:20px;font-weight:700}.result .total b{font:700 24px Georgia,serif}.status{display:flex;gap:8px;margin-top:18px}.status input{margin:0;flex:1}.status button{padding:11px;border:1px solid #c5a14a;background:#fff9e9;border-radius:9px}@media(max-width:650px){.box{margin:0;border-radius:0;min-height:100vh;padding:24px}}
</style></head><body>
<main class="box">
<header class="brand">
<img src="./assets/donnerfaust-saloon-logo.svg" alt="Donnerfaust Saloon">
<div><small>DONNERFAUST</small><b>BARRELWORKS</b></div>
</header>
<div id="root">Bestellformular wird geladen…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient("https://qsyijgvikxmwmhaiulne.supabase.co","sb_publishable_5qeUg0c0T0IyLh8g0cUj6Q_ZJYgZYJ_",{auth:{persistSession:false}});
const root=document.getElementById("root");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n)||0);
const parseDate=value=>{const m=String(value||"").trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(!m)return null;const d=Number(m[1]),mo=Number(m[2]),y=Number(m[3]),dt=new Date(Date.UTC(y,mo-1,d));if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d)return null;return dt.toISOString().slice(0,10)};
(async()=>{
 const {data:products,error}=await sb.rpc("vineyard_order_products");
 if(error){root.innerHTML="<h2>Produkte konnten nicht geladen werden.</h2><p>"+esc(error.message)+"</p>";return}
 const list=Array.isArray(products)?products:[];
 root.innerHTML='<div class="ey">ONLINE-BESTELLUNG</div><h1>Bestellung</h1><form id="form"><label>Name:</label><input name="name" autocomplete="name" required><label>Datum:</label><input name="delivery_date" type="text" inputmode="numeric" placeholder="TT.MM.JJJJ" autocomplete="off" required><label>Produkt:</label><select id="product" required></select><label>Menge:</label><input id="quantity" type="number" min="0.01" step="0.01" value="1" required><label>Lieferung:</label><select id="delivery" required><option value="false">Nein</option><option value="true">Ja (+10% Liefergebühr)</option></select><div class="result"><div><span>Warenwert:</span><b id="subtotal">$0.00</b></div><div><span>Liefergebühr:</span><b id="deliveryFee">$0.00</b></div><div class="total"><span>Gesamtpreis:</span><b id="price">$0.00</b></div></div><button class="submit" id="send" >Bestellung absenden</button><p class="muted">Der Gesamtpreis wird automatisch aus Verkaufspreis, Menge und ggf. 10% Liefergebühr berechnet.</p></form>';
 const form=document.getElementById("form"),productEl=document.getElementById("product"),quantityEl=document.getElementById("quantity"),deliveryEl=document.getElementById("delivery"),subtotalEl=document.getElementById("subtotal"),feeEl=document.getElementById("deliveryFee"),priceEl=document.getElementById("price"),send=document.getElementById("send");
 productEl.innerHTML=list.length?list.map(p=>'<option value="'+p.id+'">'+esc(p.item_name)+" · "+money(p.sale_price)+" / "+esc(p.unit)+'</option>').join(""):'<option value="">Keine Produkte vorhanden</option>';\n if(!list.length){productEl.disabled=true;send.disabled=true;send.textContent="Keine Produkte verfügbar";}
 const refreshPrice=()=>{const p=list.find(x=>x.id===productEl.value),q=Number(quantityEl.value)||0,subtotal=Math.round(q*Number(p?.sale_price||0)*100)/100,fee=deliveryEl.value==="true"?Math.round(subtotal*.10*100)/100:0;subtotalEl.textContent=money(subtotal);feeEl.textContent=money(fee);priceEl.textContent=money(subtotal+fee)};
 productEl.onchange=refreshPrice;quantityEl.oninput=refreshPrice;deliveryEl.onchange=refreshPrice;refreshPrice();
 form.onsubmit=async e=>{e.preventDefault();send.disabled=true;try{if(!list.length)throw Error("Aktuell sind keine Produkte vorhanden.");const deliveryDate=parseDate(form.delivery_date.value);if(!deliveryDate)throw Error("Bitte das Datum im Format TT.MM.JJJJ eingeben.");const today=new Date();today.setHours(0,0,0,0);const entered=new Date(deliveryDate+"T00:00:00");if(entered<today)throw Error("Das Lieferdatum darf nicht in der Vergangenheit liegen.");const p=list.find(x=>x.id===productEl.value),quantity=Number(quantityEl.value);if(!p)throw Error("Bitte ein Produkt auswählen.");if(!Number.isFinite(quantity)||quantity<=0)throw Error("Bitte eine gültige Menge eingeben.");const {data,error}=await sb.rpc("vineyard_create_order_v2",{p_customer_name:form.name.value.trim(),p_delivery_date:deliveryDate,p_delivery_requested:deliveryEl.value==="true",p_items:[{inventory_id:p.id,quantity}]});if(error)throw error;const link=new URL("./bestellstatus.html?token="+encodeURIComponent(data.customer_token),location.href).href;root.innerHTML='<div class="result"><div class="ey">BESTELLUNG EINGEGANGEN</div><h1>Vielen Dank!</h1><p>Bestellung <b>'+esc(data.order_number)+'</b> wurde erfolgreich übermittelt.</p><div class="total"><span>Gesamtpreis:</span><b>'+money(data.total)+'</b></div><p>Lieferdatum: <b>'+esc(form.delivery_date.value.trim())+'</b><br>Lieferung: <b>'+((data.delivery_requested)?"Ja · +10%":"Nein")+'</b></p><p>Über diesen Link kannst du später den Bestellstatus prüfen:</p><div class="status"><input id="statusLink" readonly value="'+esc(link)+'"><button class="copy" id="copy">Link kopieren</button></div></div>';document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(link);alert("Link kopiert.")}catch(_){prompt("Status-Link",link)}}}catch(err){alert(err.message||String(err));send.disabled=false}};
})();
</script></body></html>
