<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bestellung · Donnerfaust Vineyards</title><style>
body{margin:0;background:#f5f0e5;color:#17202a;font:16px Arial,sans-serif}.box{max-width:620px;margin:32px auto;padding:30px;background:#fffdf8;border:1px solid #ddd5c5;border-radius:20px;box-sizing:border-box}.brand{display:flex;gap:14px;align-items:center;border-bottom:1px solid #e5dfd4;padding-bottom:18px;margin-bottom:28px}.brand img{width:64px;height:64px;border-radius:14px;object-fit:cover}.brand small,.ey{display:block;color:#b09242;font-weight:800;letter-spacing:.18em;font-size:10px}.brand b,h1{font-family:Georgia,serif}.brand b{font-size:20px}h1{font-size:34px;margin:8px 0 26px}label{display:block;font-size:12px;font-weight:800;color:#6d665c;margin:0 0 7px}input,select{width:100%;box-sizing:border-box;padding:14px;border:1px solid #d7cfc1;border-radius:10px;background:#fff;font:inherit;margin-bottom:20px}input[readonly]{background:#f7f1e4;font-weight:700}.submit{width:100%;padding:15px;border:0;border-radius:10px;background:#c5a14a;color:#17202a;font-weight:800;font-size:16px;margin-top:4px}.muted{font-size:12px;color:#888;text-align:center;line-height:1.5}.result{text-align:center;padding:10px 0 4px}.result .total{display:flex;justify-content:space-between;border-top:1px solid #ddd5c5;padding-top:16px;margin-top:20px;font-weight:700}.result .total b{font:700 24px Georgia,serif}.status{display:flex;gap:8px;margin-top:18px}.status input{margin:0;flex:1}.status button{padding:11px;border:1px solid #c5a14a;background:#fff9e9;border-radius:9px}@media(max-width:650px){.box{margin:0;border-radius:0;min-height:100vh;padding:24px}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient("https://qsyijgvikxmwmhaiulne.supabase.co","sb_publishable_5qeUg0c0T0IyLh8g0cUj6Q_ZJYgZYJ_",{auth:{persistSession:false}}),root=document.getElementById("root");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n)||0);
(async()=>{
 const {data:p,error}=await sb.rpc("vineyard_order_products");
 if(error||!p?.length){root.innerHTML='<div class="ey">ONLINE-BESTELLUNG</div><h1>Aktuell keine Produkte verfügbar.</h1><p class="muted">Sobald im Lager Produkte mit Verkaufspreis hinterlegt sind, erscheinen sie hier automatisch.</p>';return}
 root.innerHTML='<div class="ey">ONLINE-BESTELLUNG</div><h1>Deine Bestellung</h1><form id="f"><label>Name:</label><input name="name" autocomplete="name" required><label>Produkt:</label><select name="product" id="product" required>'+p.map(x=>'<option value="'+x.id+'">'+esc(x.item_name)+'</option>').join("")+'</select><label>Menge:</label><input name="quantity" id="quantity" type="number" min="0.0001" step="any" value="1" required><label>Preis:</label><input id="price" readonly value="$0.00"><button class="submit" id="send">Bestellung absenden</button></form><p class="muted">Der Preis wird automatisch aus dem hinterlegten Verkaufspreis und der Menge berechnet.</p>';
 const product=document.getElementById("product"),quantity=document.getElementById("quantity"),price=document.getElementById("price");
 const refresh=()=>{const item=p.find(x=>x.id===product.value);price.value=money((Number(quantity.value)||0)*Number(item?.sale_price||0));};
 product.onchange=refresh;quantity.oninput=refresh;refresh();
 f.onsubmit=async e=>{e.preventDefault();send.disabled=true;try{const item=p.find(x=>x.id===product.value),qty=Number(quantity.value)||0;if(!item||qty<=0)throw Error("Bitte Produkt und Menge prüfen.");const {data,error}=await sb.rpc("vineyard_create_order",{p_customer_name:f.name.value.trim(),p_customer_email:"",p_customer_phone:"",p_customer_address:"",p_customer_note:"",p_items:[{inventory_id:item.id,quantity:qty}]});if(error)throw error;const link=new URL("./bestellstatus.html?token="+encodeURIComponent(data.customer_token),location.href).href;root.innerHTML='<div class="result"><div class="ey">BESTELLUNG EINGEGANGEN</div><h1>Vielen Dank!</h1><p>Bestellung <b>'+esc(data.order_number)+'</b> wurde erfolgreich übermittelt.</p><div class="total"><span>Preis</span><b>'+money(data.total)+'</b></div><p>Über diesen Link kannst du den Bestellstatus prüfen:</p><div class="status"><input readonly value="'+esc(link)+'"><button id="cp" type="button">Kopieren</button></div></div>';cp.onclick=async()=>{try{await navigator.clipboard.writeText(link);alert("Link kopiert.")}catch(_){prompt("Status-Link",link)}}}catch(x){alert(x.message||x);send.disabled=false}}})();
</script></body></html>
