<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bestellung · Donnerfaust Vineyards</title><style>
body{margin:0;background:#f5f0e5;color:#17202a;font:15px Arial,sans-serif}.box{max-width:760px;margin:30px auto;padding:28px;background:#fffdf8;border:1px solid #ddd5c5;border-radius:20px;box-sizing:border-box}.brand{display:flex;gap:14px;align-items:center;border-bottom:1px solid #e5dfd4;padding-bottom:18px;margin-bottom:24px}.brand img{width:64px;height:64px;border-radius:14px;object-fit:cover}.brand small,.ey{display:block;color:#b09242;font-weight:800;letter-spacing:.18em;font-size:10px}.brand b,h1,h2{font-family:Georgia,serif}.brand b{font-size:20px}h1{font-size:36px;margin:7px 0}p{color:#777;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}label{display:block;font-size:11px;font-weight:800;color:#6d665c;margin:0 0 5px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d7cfc1;border-radius:9px;background:white;font:inherit;margin-bottom:14px}textarea{min-height:80px;resize:vertical}.items{margin-top:8px}.item{display:grid;grid-template-columns:1fr 100px 38px;gap:7px}.item button,.add,.copy{border:1px solid #c5a14a;background:#fff9e9;border-radius:9px}.total{display:flex;justify-content:space-between;border-top:1px solid #ddd5c5;padding-top:16px;margin-top:8px;font-weight:700}.total b{font:700 24px Georgia,serif}.submit{width:100%;padding:14px;border:0;border-radius:9px;background:#c5a14a;font-weight:800;margin-top:18px}.head{display:flex;justify-content:space-between;align-items:center}.result{text-align:center;padding:20px}.status{display:flex;gap:7px;margin-top:14px}.status input{margin:0;flex:1}.status button{padding:10px}.muted{font-size:11px;color:#888;text-align:center}@media(max-width:650px){.box{margin:0;border-radius:0;min-height:100vh}.grid{grid-template-columns:1fr}h1{font-size:30px}.item{grid-template-columns:1fr 80px 36px}.status{flex-direction:column}}
</style></head><body><main class="box"><header class="brand"><img src="./assets/donnerfaust-vineyards-logo.jpg"><div><small>DONNERFAUST</small><b>VINEYARDS</b></div></header><div id="root">Bestellformular wird geladen…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient("https://qsyijgvikxmwmhaiulne.supabase.co","sb_publishable_5qeUg0c0T0IyLh8g0cUj6Q_ZJYgZYJ_",{auth:{persistSession:false}}),root=document.getElementById("root");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n)||0);
(async()=>{const {data:p,error}=await sb.rpc("vineyard_order_products");if(error||!p?.length){root.innerHTML="<h2>Aktuell keine Produkte verfügbar.</h2>";return}let r=[{inventory_id:p[0].id,quantity:1}];root.innerHTML='<div class="ey">ONLINE-BESTELLUNG</div><h1>Deine Bestellung</h1><p>Wähle deine Produkte. Der Preis wird automatisch aus den aktuellen Verkaufspreisen berechnet.</p><form id="f"><div class="grid"><div><label>Name *</label><input name="name" required></div><div><label>E-Mail *</label><input name="email" type="email" required></div><div><label>Telefon</label><input name="phone"></div><div><label>Liefer-/Abholadresse</label><input name="address"></div></div><label>Hinweise</label><textarea name="note"></textarea><div class="head"><h2>Produkte</h2><button type="button" class="add" id="add">+ Produkt</button></div><div id="items" class="items"></div><div class="total"><span>Gesamtsumme</span><b id="sum">$0.00</b></div><button class="submit" id="send">Bestellung verbindlich absenden</button><p class="muted">Dieses Formular ist vollständig getrennt von der internen Vineyard-Verwaltung.</p></form>';
function draw(){items.innerHTML=r.map((x,n)=>'<div class="item"><select data-p="'+n+'">'+p.map(y=>'<option value="'+y.id+'" '+(y.id===x.inventory_id?"selected":"")+'>'+esc(y.item_name)+' · '+esc(y.unit)+' · '+money(y.sale_price)+'</option>').join("")+'</select><input data-q="'+n+'" type="number" min=".0001" step="any" value="'+x.quantity+'"><button type="button" data-r="'+n+'">×</button></div>').join("");const refresh=()=>{let t=0;r.forEach((x,n)=>{x.inventory_id=document.querySelector('[data-p="'+n+'"]').value;x.quantity=Number(document.querySelector('[data-q="'+n+'"]').value)||0;t+=x.quantity*Number(p.find(y=>y.id===x.inventory_id)?.sale_price||0)});sum.textContent=money(t)};document.querySelectorAll("[data-p]").forEach(x=>x.onchange=refresh);document.querySelectorAll("[data-q]").forEach(x=>x.oninput=refresh);document.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>{r.splice(+x.dataset.r,1);if(!r.length)r.push({inventory_id:p[0].id,quantity:1});draw()});refresh()}draw();add.onclick=()=>{r.push({inventory_id:p[0].id,quantity:1});draw()};
f.onsubmit=async e=>{e.preventDefault();send.disabled=true;try{const v=Object.fromEntries(new FormData(f)),items=r.map((x,n)=>({inventory_id:document.querySelector('[data-p="'+n+'"]').value,quantity:Number(document.querySelector('[data-q="'+n+'"]').value)}));const {data,error}=await sb.rpc("vineyard_create_order",{p_customer_name:v.name,p_customer_email:v.email,p_customer_phone:v.phone,p_customer_address:v.address,p_customer_note:v.note,p_items:items});if(error)throw error;const link=new URL("./bestellstatus.html?token="+encodeURIComponent(data.customer_token),location.href).href;root.innerHTML='<div class="result"><div class="ey">BESTELLUNG EINGEGANGEN</div><h1>Vielen Dank!</h1><p>Bestellung <b>'+esc(data.order_number)+'</b> wurde erfolgreich übermittelt.</p><div class="total"><span>Gesamtsumme</span><b>'+money(data.total)+'</b></div><p>Hier kannst du später den Status prüfen:</p><div class="status"><input id="sl" readonly value="'+esc(link)+'"><button class="copy" id="cp">Link kopieren</button></div></div>';cp.onclick=async()=>{try{await navigator.clipboard.writeText(link);alert("Link kopiert.")}catch(_){prompt("Status-Link",link)}}}catch(x){alert(x.message||x);send.disabled=false}}})();
</script></body></html>
