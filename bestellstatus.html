<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bestellstatus · Donnerfaust Saloon</title><style>body{margin:0;background:#f5f0e5;font:15px Arial;color:#17202a}.box{max-width:760px;margin:30px auto;padding:28px;background:#fffdf8;border:1px solid #ddd5c5;border-radius:20px;box-sizing:border-box}.brand{display:flex;gap:14px;align-items:center;border-bottom:1px solid #e5dfd4;padding-bottom:18px;margin-bottom:25px}.brand img{width:64px;height:64px;border-radius:14px}.brand small,.ey{display:block;color:#b09242;font-weight:800;letter-spacing:.18em;font-size:10px}.brand b,h1{font-family:Georgia,serif}.brand b{font-size:20px}h1{font-size:34px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{padding:14px;border:1px solid #ddd5c5;border-radius:10px}.cell small{display:block;color:#888;font-size:9px;font-weight:800;margin-bottom:5px}.cell b{font-family:Georgia,serif}.statuscell b{display:block}.statuscell.status-waiting b{color:#8a6a1f}.statuscell.status-progress b{color:#9a6b00}.statuscell.status-done b{color:#2f6b3a}.statuscell.status-cancelled b{color:#9a3030}.statuscell span{display:block;margin-top:6px;color:#777;font-size:11px}.items{border-top:1px solid #ddd5c5;margin-top:20px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee6da}.total{display:flex;justify-content:space-between;margin-top:18px}.total b{font:700 25px Georgia,serif}.muted{color:#777;font-size:11px}@media(max-width:650px){.box{margin:0;border-radius:0;min-height:100vh}.grid{grid-template-columns:1fr}}</style></head><body><main class="box"><header class="brand"><img src="./assets/donnerfaust-saloon-logo.svg"><div><small>DONNERFAUST</small><b>SALOON</b></div></header><div id="root">Bestellstatus wird geladen…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=supabase.createClient("https://qsyijgvikxmwmhaiulne.supabase.co","sb_publishable_5qeUg0c0T0IyLh8g0cUj6Q_ZJYgZYJ_",{auth:{persistSession:false}});
const root=document.getElementById("root");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n)||0);
const token=new URLSearchParams(location.search).get("token");
const labels={
 "Eingegangen":["Eingegangen","Die Bestellung wartet auf Annahme durch einen Mitarbeiter.","status-waiting"],
 "In Bearbeitung":["In Bearbeitung","Ein Mitarbeiter bearbeitet deine Bestellung.","status-progress"],
 "Bestellung abgeschlossen":["Erledigt","Deine Bestellung wurde abgeschlossen.","status-done"],
 "Lieferung abgeschlossen":["Abgeschlossen","Deine Bestellung wurde geliefert.","status-done"],
 "Storniert":["Storniert","Die Bestellung wurde storniert.","status-cancelled"]
};
let orderLoaded=false;
function applyStatus(status){
 const statusEl=document.getElementById("orderStatus");
 const statusCell=statusEl?.closest(".statuscell");
 const hintEl=document.getElementById("statusHint");
 const value=labels[status]||[status||"Unbekannt","", ""];
 if(statusEl)statusEl.textContent=value[0];
 if(hintEl)hintEl.textContent=value[1];
 if(statusCell)statusCell.className="cell statuscell "+value[2];
}
async function loadOrder(initial=false){
 if(!token){
  if(initial)root.innerHTML="<h2>Kein Bestellstatus angegeben.</h2><p>Bitte öffne den vollständigen Status-Link aus deiner Bestellbestätigung.</p>";
  return;
 }
 try{
  const {data,error}=await sb.rpc("vineyard_public_order",{p_customer_token:token});
  if(error)throw error;
  if(!data?.order)throw Error("Bestellung nicht gefunden.");
  const o=data.order;
  if(!orderLoaded){
   const date=o.delivery_date?new Date(o.delivery_date+"T00:00:00").toLocaleDateString("de-DE"):"—";
   const delivery=o.delivery_requested?"Ja · +10% Liefergebühr":"Nein";
   root.innerHTML='<div class="ey">BESTELLSTATUS</div><h1>'+esc(o.order_number)+'</h1><div class="grid"><div class="cell statuscell"><small>BESTELLSTATUS</small><b id="orderStatus"></b><span id="statusHint"></span></div><div class="cell"><small>KUNDE</small><b>'+esc(o.customer_name)+'</b></div><div class="cell"><small>MITARBEITER</small><b>'+esc(o.employee_name||"Noch nicht zugewiesen")+'</b></div><div class="cell"><small>LIEFERDATUM</small><b>'+esc(date)+'</b></div><div class="cell"><small>LIEFERUNG</small><b>'+esc(delivery)+'</b></div></div><div class="items">'+(data.items||[]).map(x=>'<div class="row"><span>'+esc(x.item_name)+' · '+esc(x.quantity)+" "+esc(x.unit)+'</span><b>'+money(x.line_total)+'</b></div>').join("")+'</div><div class="total"><span>Gesamtsumme</span><b>'+money(o.total)+'</b></div><p class="muted" id="refreshHint">Der Status aktualisiert sich automatisch. Du musst die Seite nicht neu laden.</p>';
   orderLoaded=true;
  }
  applyStatus(o.status);
 }catch(error){
  if(initial&&!orderLoaded)root.innerHTML='<h2>Bestellstatus konnte nicht geladen werden.</h2><p>'+esc(error?.message||"Bitte überprüfe den Link und versuche es erneut.")+'</p><button id="retry" style="padding:12px;border:1px solid #c5a14a;background:#fff9e9;border-radius:9px">Erneut versuchen</button>';
  const retry=document.getElementById("retry");
  if(retry)retry.onclick=()=>loadOrder(true);
  else if(orderLoaded){const hint=document.getElementById("refreshHint");if(hint)hint.textContent="Aktualisierung momentan nicht möglich. Wir versuchen es automatisch erneut."}
 }
}
loadOrder(true);
setInterval(()=>loadOrder(false),10000);
</script></body></html>
